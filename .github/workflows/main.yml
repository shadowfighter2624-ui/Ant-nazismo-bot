name: Deploy bot para Quaxly

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

    steps:
      - name: Baixar arquivos do GitHub
        uses: actions/checkout@v4

      - name: Preparar npm
        run: |
          echo "cache=.npm" > .npmrc

      - name: Criar pasta de cache no Quaxly
        env:
          QUAXLY_HOST: ${{ secrets.QUAXLY_HOST }}
          QUAXLY_PORT: ${{ secrets.QUAXLY_PORT }}
          QUAXLY_USER: ${{ secrets.QUAXLY_USER }}
          QUAXLY_PASSWORD: ${{ secrets.QUAXLY_PASSWORD }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass
          sshpass -p "$QUAXLY_PASSWORD" sftp -o StrictHostKeyChecking=no -P "$QUAXLY_PORT" "$QUAXLY_USER@$QUAXLY_HOST" <<'EOF'
          -mkdir .npm
          -mkdir .npm/_cacache
          -mkdir .npm/_logs
          bye
          EOF

      - name: Enviar package.json
        uses: wlixcc/SFTP-Deploy-Action@v1.2.6
        with:
          username: ${{ secrets.QUAXLY_USER }}
          server: ${{ secrets.QUAXLY_HOST }}
          port: ${{ secrets.QUAXLY_PORT }}
          password: ${{ secrets.QUAXLY_PASSWORD }}
          local_path: './package.json'
          remote_path: '/'
          sftp_only: true

      - name: Enviar npmrc
        uses: wlixcc/SFTP-Deploy-Action@v1.2.6
        with:
          username: ${{ secrets.QUAXLY_USER }}
          server: ${{ secrets.QUAXLY_HOST }}
          port: ${{ secrets.QUAXLY_PORT }}
          password: ${{ secrets.QUAXLY_PASSWORD }}
          local_path: './.npmrc'
          remote_path: '/'
          sftp_only: true

      - name: Enviar src
        uses: wlixcc/SFTP-Deploy-Action@v1.2.6
        with:
          username: ${{ secrets.QUAXLY_USER }}
          server: ${{ secrets.QUAXLY_HOST }}
          port: ${{ secrets.QUAXLY_PORT }}
          password: ${{ secrets.QUAXLY_PASSWORD }}
          local_path: './src/*'
          remote_path: '/src'
          sftp_only: true
